<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5a1f'/%3E%3Crect x='7.5' y='5' width='4.6' height='20.6' rx='2.3' fill='%230e0e0c'/%3E%3Ccircle cx='17.6' cy='18.6' r='5.1' fill='none' stroke='%230e0e0c' stroke-width='4.4'/%3E%3Crect x='4.5' y='25.4' width='23' height='2.8' rx='1.4' fill='%230e0e0c'/%3E%3Ccircle cx='25.2' cy='8.2' r='2.7' fill='%23d4ff3a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" title="Baseline home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#ff5a1f"/>
        <rect x="7.5" y="5" width="4.6" height="20.6" rx="2.3" fill="#0e0e0c"/>
        <circle cx="17.6" cy="18.6" r="5.1" fill="none" stroke="#0e0e0c" stroke-width="4.4"/>
        <rect x="4.5" y="25.4" width="23" height="2.8" rx="1.4" fill="#0e0e0c"/>
        <circle cx="25.2" cy="8.2" r="2.7" fill="#d4ff3a"/>
      </svg><span class="wordmark">baseline<i>.</i></span></a>
    <nav class="tabs" id="tabs">
      <button data-view="schedule">Schedule</button>
      <button data-view="projects">Projects</button>
      <button data-view="pipeline">Pipeline</button>
      <button data-view="capacity">Capacity</button>
      <button data-view="people">People</button>
      <button data-view="holidays">Holidays</button>
      <button data-view="report">Report</button>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <div class="menu">
        <button class="icon-btn" id="menuBtn" title="More">&#8943;</button>
        <div class="menu-pop" id="menuPop" hidden>
          <button data-action="export">Export data (JSON)</button>
          <button data-action="import">Import data (JSON)</button>
          <button data-action="csv">Export schedule (CSV)</button>
          <hr>
          <button data-action="sample">Load sample data</button>
          <button data-action="clear" class="danger-text">Clear all data</button>
        </div>
      </div>
    </div>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <main id="main"></main>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
