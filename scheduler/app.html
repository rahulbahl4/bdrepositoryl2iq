<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crewplan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M21.7 10.3A8 8 0 1 0 21.7 21.7' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3Crect x='13.5' y='14.4' width='11' height='3.2' rx='1.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" title="Crewplan home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="cpMarkApp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#cpMarkApp)"/>
        <path d="M21.7 10.3A8 8 0 1 0 21.7 21.7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="13.5" y="14.4" width="11" height="3.2" rx="1.6" fill="#fff"/>
      </svg><span>Crewplan</span></a>
    <nav class="tabs" id="tabs">
      <button data-view="schedule">Schedule</button>
      <button data-view="projects">Projects</button>
      <button data-view="people">People</button>
      <button data-view="holidays">Holidays</button>
      <button data-view="report">Report</button>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <div class="menu">
        <button class="icon-btn" id="menuBtn" title="More">&#8943;</button>
        <div class="menu-pop" id="menuPop" hidden>
          <button data-action="export">Export data (JSON)</button>
          <button data-action="import">Import data (JSON)</button>
          <button data-action="csv">Export schedule (CSV)</button>
          <hr>
          <button data-action="sample">Load sample data</button>
          <button data-action="clear" class="danger-text">Clear all data</button>
        </div>
      </div>
    </div>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <main id="main"></main>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
